name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Collect static files
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-value-0123456789
        run: python manage.py collectstatic --noinput

      - name: Run tests
        env:
          # Required: the production security block is evaluated at import
          # time, so without this the suite asserts Django's defaults instead
          # of this project's configuration.
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-value-0123456789
          SKIP_BROWSER_TESTS: "1"
        run: python manage.py test tests --shuffle

      - name: Deployment checks
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-value-0123456789
          DJANGO_ALLOWED_HOSTS: sectrexconsulting.com
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          DJANGO_BEHIND_PROXY: "True"
        run: python manage.py check --deploy --fail-level WARNING

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=moderate

  static-analysis:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit semgrep
      - name: bandit
        run: bandit -r apps/ sectrix/ -ll
      - name: semgrep
        run: semgrep --config p/django --config p/owasp-top-ten --config p/secrets --error apps/ sectrix/

  container:
    name: Image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sectrex:ci .
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sectrex:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          # Catches secrets baked into image layers, not just package CVEs.
          scanners: vuln,secret
