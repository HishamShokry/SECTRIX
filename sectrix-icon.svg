<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Sectrix icon">
  <title>Sectrix icon</title>

  <rect width="240" height="240" fill="#FFFFFF"/>

  <!-- 200x200 icon centered inside a 240x240 safe area -->
  <g transform="translate(20, 20)">

    <!-- Four converging blades forming the X -->
    <polygon points="57,37 93,87 87,93 37,57"       fill="#0E1F3A"/>
    <polygon points="143,37 107,87 113,93 163,57"   fill="#0E1F3A"/>
    <polygon points="57,163 93,113 87,107 37,143"   fill="#0E1F3A"/>
    <polygon points="143,163 107,113 113,107 163,143" fill="#0E1F3A"/>

    <!-- Central node — accent -->
    <polygon points="100,92 108,100 100,108 92,100" fill="#00B4F0"/>

  </g>
</svg>
