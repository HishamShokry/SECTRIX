{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>{% block title %}{{ meta_title|default:site.name|add:" · Enterprise Cybersecurity" }}{% endblock %}</title>

<meta name="description" content="{% block description %}{{ meta_description|default:site.description }}{% endblock %}">
<meta name="keywords" content="{{ site.keywords }}">
<meta name="author" content="{{ site.name }}">
<meta name="theme-color" content="#0E1F3A">
{% if not allow_indexing %}<meta name="robots" content="noindex, nofollow">{% endif %}

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{% block og_title %}{{ meta_title|default:site.name }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{{ meta_description|default:site.description }}{% endblock %}">
<meta property="og:url" content="{{ site.url }}{{ request.path }}">
<meta property="og:image" content="{% static 'img/og-default.svg' %}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="{{ site.twitter }}">
<meta name="twitter:title" content="{% block twitter_title %}{{ meta_title|default:site.name }}{% endblock %}">
<meta name="twitter:description" content="{% block twitter_description %}{{ meta_description|default:site.description }}{% endblock %}">

<!-- Favicons -->
<link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
<link rel="mask-icon" href="{% static 'img/favicon.svg' %}" color="#00B4F0">
<link rel="manifest" href="{% static 'site.webmanifest' %}">

<!-- Canonical -->
<link rel="canonical" href="{{ site.url }}{{ request.path }}">

<!-- Structured data: organization -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site.name }}",
  "url": "{{ site.url }}",
  "logo": "{{ site.url }}{% static 'img/logo.svg' %}",
  "description": "{{ site.description }}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Dubai Internet City",
    "addressLocality": "Dubai",
    "addressCountry": "AE"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "{{ site.phone }}",
    "contactType": "sales",
    "areaServed": ["AE","SA","QA","KW","BH","OM"],
    "availableLanguage": ["English","Arabic"]
  }
}
</script>
