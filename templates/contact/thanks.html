{% extends "base.html" %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-6">
  <div class="text-center max-w-xl" data-reveal>
    <div class="mx-auto w-16 h-16 rounded-full border border-accent/40 bg-accent/10 text-accent flex items-center justify-center mb-6">
      <svg viewBox="0 0 24 24" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 12.5l5 5 11-11" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="text-xs font-semibold tracking-wider-3 text-accent uppercase mb-4">Inquiry received</p>
    <h1 class="font-display text-4xl sm:text-5xl font-semibold tracking-tightest text-white">Thank you.</h1>
    <p class="mt-5 text-lg text-graphite-200">
      A Sectrix specialist will reach out within one business day. For urgent matters, our 24 / 7 line is
      <a href="tel:+97140000000" class="text-accent hover:underline whitespace-nowrap">+971 4 000 0000</a>.
    </p>
    <div class="mt-9 flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{% url 'core:home' %}" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-md border border-white/15 text-white font-medium hover:border-white/40 hover:bg-white/5 transition">Back to home</a>
      <a href="{% url 'services:list' %}" class="inline-flex items-center justify-center gap-2 px-5 py-3 rounded-md bg-accent text-navy-950 font-semibold hover:bg-accent-soft transition">Explore services</a>
    </div>
  </div>
</section>
{% endblock %}
