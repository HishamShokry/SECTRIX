{% extends "base.html" %}

{% block title %}500 — Internal error · Sectrix{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-6">
  <div class="text-center max-w-xl">
    <p class="text-xs font-semibold tracking-wider-3 text-accent uppercase mb-4">Error 500</p>
    <h1 class="font-display text-5xl sm:text-6xl font-semibold tracking-tightest text-white">Service degraded.</h1>
    <p class="mt-5 text-graphite-200">
      An internal exception was raised. Our team has been notified.
    </p>
    <div class="mt-8">
      <a href="{% url 'core:home' %}" class="inline-flex items-center gap-2 px-5 py-3 rounded-md bg-accent text-navy-950 font-semibold hover:bg-accent-soft transition">
        Back to home
      </a>
    </div>
  </div>
</section>
{% endblock %}
