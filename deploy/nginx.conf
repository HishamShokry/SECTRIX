# Sectrex — nginx reverse proxy for the Gunicorn container.
#
# Install on the host as /etc/nginx/sites-available/sectrix, then:
#   ln -s /etc/nginx/sites-available/sectrix /etc/nginx/sites-enabled/sectrix
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Run certbot AFTER this file is in place and DNS resolves; it rewrites the
# server blocks below to add the TLS listener and the :80 -> :443 redirect.

upstream sectrix_app {
    # docker-compose.yml publishes the app on 127.0.0.1:8001 only.
    server 127.0.0.1:8001 fail_timeout=0;
}

# --- Rate limiting -----------------------------------------------------
# The application has no throttling of its own beyond the admin lockout, so
# the edge is where volumetric abuse is stopped: unbounded contact-form POSTs
# both fill the database and relay mail, and /admin/login/ is the only
# authenticated surface.
limit_req_zone  $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=admin:10m   rate=20r/m;
limit_req_zone  $binary_remote_addr zone=general:10m rate=120r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# --- Privacy-preserving access log -------------------------------------
# The default `combined` format stores full client IPs indefinitely, which
# re-identifies the named submitter of any inquiry by timestamp. Keep the /24
# for abuse triage and drop the host octet.
map $remote_addr $ip_anon {
    ~(?P<prefix>\d+\.\d+\.\d+)\.\d+   "$prefix.0";
    ~(?P<prefix6>[0-9a-fA-F:]+:)[0-9a-fA-F]*$  "$prefix6:";
    default                            "0.0.0.0";
}

log_format privacy '$ip_anon - - [$time_local] "$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    # Let certbot answer HTTP-01 challenges before TLS exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # CaseStudy.cover_image uploads go through the admin.
    client_max_body_size 12M;
    client_body_timeout  30s;
    limit_conn perip 20;

    # Don't advertise the exact nginx build.
    server_tokens off;

    # --- Security headers ---------------------------------------------
    # Set here rather than only in Django so they also cover responses nginx
    # generates itself (error pages, ACME, 413s). `always` applies them to
    # error responses too.
    #
    # 'unsafe-inline' is still required: base.html carries an inline
    # IntersectionObserver block and Alpine evaluates inline directives. To
    # drop it, move that script to a file and adopt nonces via django-csp.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://sectrix_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Required: settings.py trusts this header only when
        # DJANGO_BEHIND_PROXY=True. It is overwritten (not appended) here, so
        # a client cannot forge the scheme.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # The public write endpoint: unauthenticated, and each POST costs a
    # database row plus an outbound email.
    location /contact/ {
        limit_req zone=contact burst=3 nodelay;
        proxy_pass http://sectrix_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # django-axes locks accounts out after repeated failures; this throttles
    # the attempts before they reach Python at all.
    location /admin/ {
        limit_req zone=admin burst=5 nodelay;
        # Uncomment to restrict the admin to known networks:
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://sectrix_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WhiteNoise already serves /static/ with far-future caching headers and
    # hashed filenames, so nginx just proxies it rather than duplicating the
    # STATIC_ROOT on the host.

    access_log /var/log/nginx/sectrix.access.log privacy;
    error_log  /var/log/nginx/sectrix.error.log;
}
