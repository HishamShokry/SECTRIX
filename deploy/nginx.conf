# Sectrix — nginx reverse proxy for the Gunicorn container.
#
# Install on the droplet as /etc/nginx/sites-available/sectrix, then:
#   ln -s /etc/nginx/sites-available/sectrix /etc/nginx/sites-enabled/sectrix
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Run certbot AFTER this file is in place and DNS resolves; it rewrites the
# server blocks below to add the TLS listener and the :80 -> :443 redirect.

upstream sectrix_app {
    # docker-compose.yml maps the web container to host port 8001.
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER www.DOMAIN_PLACEHOLDER;

    # Let certbot answer HTTP-01 challenges before TLS exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # CaseStudy.cover_image uploads go through the admin.
    client_max_body_size 12M;

    location / {
        proxy_pass http://sectrix_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Required: settings.py sets SECURE_PROXY_SSL_HEADER when DEBUG=False,
        # so Django reads this header to decide the request was HTTPS. Without
        # it, secure cookies and HSTS behave incorrectly behind TLS.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_read_timeout 60s;
    }

    # WhiteNoise already serves /static/ with far-future caching headers and
    # hashed filenames, so nginx just proxies it rather than duplicating the
    # STATIC_ROOT on the host.

    access_log /var/log/nginx/sectrix.access.log;
    error_log  /var/log/nginx/sectrix.error.log;
}
