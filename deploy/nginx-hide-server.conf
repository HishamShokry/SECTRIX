# Sectrex — remove the Server response header entirely.
#
# Installed as /etc/nginx/conf.d/01-hide-server.conf, but ONLY when the
# headers-more module is present. It is a separate file for exactly that
# reason: `more_clear_headers` is not a core directive, so loading this
# without the module makes nginx refuse to start.
#
#   apt install libnginx-mod-http-headers-more-filter
#
# `server_tokens off` (00-security.conf) only reduces the header to "nginx";
# suppressing it completely needs this module.
#
# Install via: ./deploy/install-nginx-config.sh --hide-server

more_clear_headers Server;
