# Sectrex — host-wide nginx hardening.
#
# Install as /etc/nginx/conf.d/00-security.conf on the host running nginx.
# conf.d is included from the http block, so these apply to every vhost --
# including the certbot-managed one and nginx's own error pages, which never
# reach Django and therefore never get Django's headers.
#
#   scp deploy/nginx-security-headers.conf root@HOST:/etc/nginx/conf.d/00-security.conf
#   nginx -t && systemctl reload nginx

# --- Banner disclosure -------------------------------------------------
# Without this every response advertises the exact build and distribution
# ("nginx/1.24.0 (Ubuntu)"), which hands an attacker the version-to-CVE
# lookup for free. Off reduces it to "nginx".
#
# To remove the header entirely you need a module Ubuntu's stock package
# does not ship:
#   apt install nginx-extras   # provides headers-more
#   more_clear_headers Server;
server_tokens off;

# --- Security headers --------------------------------------------------
# `always` so they are emitted on error responses too.
#
# 'unsafe-inline' is still required: base.html carries an inline
# IntersectionObserver block and Alpine evaluates inline directives. To drop
# it, move that script to a file and adopt nonces via django-csp.
# NOTE on 'unsafe-eval': Alpine evaluates its directive expressions
    # (x-show="open", @click="open = !open") with new Function(), which CSP
    # blocks without it -- the mobile menu silently stays open on phones.
    # Removing it properly means switching to Alpine's CSP build
    # (@alpinejs/csp) and rewriting every inline expression as a registered
    # component method. Until then this is the honest trade: the policy still
    # blocks third-party script origins, which is the main value here.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# --- Rate limiting -----------------------------------------------------
# Zones only; apply them with `limit_req` inside the vhost's location
# blocks (see deploy/nginx.conf). Declaring them here keeps them available
# to a certbot-managed vhost that this repo does not own.
limit_req_zone  $binary_remote_addr zone=contact:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=admin:10m   rate=20r/m;
limit_req_zone  $binary_remote_addr zone=general:10m rate=120r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=perip:10m;
