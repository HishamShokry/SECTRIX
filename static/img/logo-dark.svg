<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Sectrix">
  <title>Sectrix — dark background</title>

  <!-- Deep navy canvas -->
  <rect width="1200" height="360" fill="#0E1F3A"/>

  <g transform="translate(166, 80)">

    <!-- Blades inverted to white on dark -->
    <polygon points="57,37 93,87 87,93 37,57"       fill="#FFFFFF"/>
    <polygon points="143,37 107,87 113,93 163,57"   fill="#FFFFFF"/>
    <polygon points="57,163 93,113 87,107 37,143"   fill="#FFFFFF"/>
    <polygon points="143,163 107,113 113,107 163,143" fill="#FFFFFF"/>

    <!-- Central node retains the electric-blue accent -->
    <polygon points="100,92 108,100 100,108 92,100" fill="#00B4F0"/>

  </g>

  <text x="416" y="218"
        font-family="'Helvetica Neue', 'Inter', 'Arial', sans-serif"
        font-size="118" font-weight="500"
        fill="#FFFFFF" letter-spacing="16">SECTRIX</text>

  <line x1="418" y1="250" x2="500" y2="250" stroke="#00B4F0" stroke-width="3"/>
  <text x="514" y="257"
        font-family="'Helvetica Neue', 'Inter', 'Arial', sans-serif"
        font-size="18" font-weight="400"
        fill="#9AAAC4" letter-spacing="6">CYBERSECURITY</text>
</svg>
